name: Sync Publications from Google Scholar

on:
  schedule:
    # Run every Sunday at 00:00 UTC (weekly)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-scholar-publications
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Google Scholar Publications
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Google Scholar Synchronization
        run: |
          python3 scripts/sync-google-scholar.py

      - name: Validate web app and site build
        run: |
          cd web
          npm ci || npm install
          npm run build
          cd ..

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -n $(git status --porcelain web/src/data/generated/) ]]; then
            echo "Changes detected in publications dataset. Committing..."
            git add web/src/data/generated/
            git commit -m "chore(publications): auto-sync publications and metrics from Google Scholar"
            git push origin main
          else
            echo "Publications are already up to date with Google Scholar. No changes to commit."
          fi
